<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">
  <title>Hero Block</title>

  <link rel="preload" as="image" href="assets/img/hero-image.jpg">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
@source inline("bg-{slate,gray,zinc,neutral,stone,red,orange,amber,yellow,lime,green,emerald,teal,cyan,sky,blue,indigo,violet,purple,fuchsia,pink,rose}-{50,100,200,300,400,500,600,700,800,900,950}");
  @source inline("bg-{black,white}");

  .hero {
    @apply relative isolate flex items-center px-6 py-20 md:px-12 md:py-24;
    overflow-wrap: anywhere;
  }

  .hero-image-background {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    pointer-events: none;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background-color: var(
      --hero-overlay-colour,
      var(--color-black)
    );
    background-image: var(
      --hero-overlay-image,
      none
    );
    opacity: var(--hero-overlay-opacity, 0.4);
    pointer-events: none;
  }

  .hero-content {
    @apply w-full max-w-6xl mx-auto;
    position: relative;
    z-index: 2;
    min-width: 0;
  }

  .hero h1 {
    @apply max-w-4xl text-4xl font-bold leading-tight tracking-tight;
    @apply sm:text-5xl md:text-6xl lg:text-7xl;
    @apply text-shadow-lg/30;
    color: var(
      --hero-heading-colour,
      var(--color-white)
    );
  }

  .hero h2 {
    @apply mt-6 max-w-3xl text-lg font-normal leading-relaxed;
    @apply md:mt-8 md:text-2xl;
    @apply text-shadow-lg/30;
    color: var(
      --hero-subheading-colour,
      var(--color-white)
    );
  }

  .hero .hero-h1-sans,
  .hero .hero-h2-sans {
    @apply font-sans;
  }

  .hero .hero-h1-serif,
  .hero .hero-h2-serif {
    @apply font-serif;
  }

  .hero-centre {
    @apply text-center;
  }

  .hero-centre h1,
  .hero-centre h2 {
    @apply mx-auto;
  }

  .hero-min-height {
    @apply min-h-[480px] md:min-h-[85vh];
  }

  .hero h2[hidden] {
    display: none;
  }
  </style>

  <style id="hero-colours">
.hero {
  --hero-overlay-colour: var(--color-black);
  --hero-overlay-image: linear-gradient(to right, var(--color-fuchsia-600), var(--color-yellow-300));
  --hero-overlay-opacity: 0.40;
  --hero-heading-colour: var(--color-cyan-100);
  --hero-subheading-colour: var(--color-yellow-300);
}
  </style>

  <style id="hero-image-path">
.hero-image-background {
  background-image: url("assets/img/hero-image.jpg");
}
  </style>

  <style id="hero-letter-spacing">
.hero #hero-heading {
  letter-spacing: -0.050em;
}

.hero #hero-subheading {
  letter-spacing: -0.025em;
}
  </style>
</head>
<body>
  <header class="hero hero-centre">
    <div class="hero-image-background" aria-hidden="true"></div>
    <div class="hero-overlay" aria-hidden="true"></div>
    <div class="hero-content">
      <h1 id="hero-heading" class="hero-h1-sans">Lorem ipsum dolor sit amet</h1>
      <h2 id="hero-subheading" class="hero-h2-sans">Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
    </div>
  </header>
</body>
</html>
