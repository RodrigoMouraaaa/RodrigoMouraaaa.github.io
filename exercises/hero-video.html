<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Rodrigo Moura 81200 -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Video</title>
    <meta name="description"
    content="A responsive hero block with a looping background video, poster image and tinted overlay.">

    <link rel="preload" href="assets/videos/hero-still.jpg" as="image">

    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">

        header {
        @apply relative overflow-hidden min-h-[60vh] md:min-h-[80vh]
            bg-[url('assets/videos/hero-still.jpg')] bg-slate-900
            bg-cover bg-center
            flex flex-col justify-center
            px-6 md:px-[12%] py-12
            text-center;
        }

        header video { @apply absolute inset-0 w-full h-full object-cover; }
        .video-toggle { @apply relative z-10 mt-8 mx-auto rounded-lg border border-white bg-slate-950 px-5 py-3 text-sm text-white font-sans cursor-pointer hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-4; }

        /* The overlay sits above the video and below the headings. */
        header::before {
            content: "";
            @apply absolute inset-0 z-[1] bg-black/65 pointer-events-none;
        }

        header h1 {
            @apply relative z-10 text-5xl md:text-7xl leading-tight
            text-white font-bold
            tracking-tight
            mb-6;
        }

        header h2 {
            @apply relative z-10 text-2xl md:text-4xl leading-snug
            text-white;
        }

        header h1,
        header h2 { @apply text-shadow-lg/30; }

        .slide-in-top {
            animation: slide-in-top 1.0s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }

        /* ----------------------------------------------
        * Generated by Animista on 2026-10-12 14:45:18
        * Licensed under FreeBSD License.
        * See http://animista.net/license for more info.
        * w: http://animista.net, t: @cssanimista
        * ---------------------------------------------- */

        /**
        * ----------------------------------------
        * animation slide-in-top
        * ----------------------------------------
        */
        @keyframes slide-in-top {
                0% {
                transform: translateY(-40px);
                opacity: 0;
        }
            100% {
            transform: translateY(0);
            opacity: 1;
        }
        }

        .slide-in-left {
            animation: slide-in-left 2.0s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }

        /* ----------------------------------------------
        * Generated by Animista on 2026-10-12 15:13:47
        * Licensed under FreeBSD License.
        * See http://animista.net/license for more info.
        * w: http://animista.net, t: @cssanimista
        * ---------------------------------------------- */

        /**
        * ----------------------------------------
        * animation slide-in-left
        * ----------------------------------------
        */

        @keyframes slide-in-left {
            0% {
            transform: translateX(-40px);
            opacity: 0;
        }
            100% {
            transform: translateX(0);
            opacity: 1;
        }
}

        footer { @apply px-6 py-8 text-center bg-white text-slate-900 font-sans; }
        footer a { @apply text-purple-800 underline underline-offset-4 hover:text-purple-950 focus-visible:outline-2 focus-visible:outline-offset-4; }
        @media (prefers-reduced-motion: reduce) {
            .slide-in-top, .slide-in-left { animation: none; }
        }
    </style>

</head>

<body>

    <!-- hero block -->
     <header>
        <video id="hero-video" autoplay muted loop playsinline preload="metadata"
            poster="assets/videos/hero-still.jpg" aria-hidden="true" tabindex="-1">
            <source src="assets/videos/hero-video.mp4" type="video/mp4">
        </video>
        <h1 class="slide-in-top">Rodrigo Moura</h1>

        <h2 class="slide-in-left">The best Creative Web Developer</h2>
        <button class="video-toggle" type="button" aria-controls="hero-video">Pause background video</button>
    </header>
    <!-- /hero block -->

    <footer>
        <p><a href="../index.html">Back to home page</a></p>
        <p class="mt-4 text-sm">Video: <a href="https://www.pexels.com/video/girl-writing-on-her-notebook-2086113/">Claudia on Pexels</a>.</p>
    </footer>
    <script>
        const video = document.querySelector('#hero-video');
        const toggle = document.querySelector('.video-toggle');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        function updateButton() {
            toggle.textContent = video.paused ? 'Play background video' : 'Pause background video';
        }
        function respectMotionPreference() {
            if (reducedMotion.matches) {
                video.autoplay = false;
                video.pause();
            }
            updateButton();
        }
        toggle.addEventListener('click', async () => {
            if (video.paused) {
                try { await video.play(); } catch { updateButton(); }
            } else {
                video.pause();
            }
        });
        video.addEventListener('play', updateButton);
        video.addEventListener('pause', updateButton);
        video.addEventListener('loadeddata', respectMotionPreference);
        reducedMotion.addEventListener('change', respectMotionPreference);
        respectMotionPreference();
    </script>
</body>
</html>
